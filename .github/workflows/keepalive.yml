# Keep the daily rotation alive.
#
# GitHub switches off scheduled workflows after 60 days without repository
# activity, and that is exactly what happened here: the rotation ran every
# morning until it was disabled with the state `disabled_inactivity`, and the
# daily puzzle quietly stopped advancing. Nothing failed and nothing alerted.
# A player noticing yesterday's REquation was the only symptom.
#
# This repo is the shape that trips it. It is published content, written to by
# a robot and read by the game, so months pass with no human push. The bot's
# own commits do not reset the timer; only activity attributable to a person
# does, which is why a repo that rotates a file every single morning can still
# read as untouched.
#
# So this runs well inside the window and pushes a dated line to a file that
# exists for no other purpose. It is a workaround, and it is worth being honest
# about that: the real fix is to run the schedule from a repository people
# actually commit to. See KEEPALIVE.md.
name: Keepalive

on:
  schedule:
    # The 1st and the 15th. Twice the frequency needed for a 60 day window, so
    # a single missed run cannot cost the schedule.
    - cron: '0 5 1,15 * *'
  workflow_dispatch:

# The default token can push, and whether its pushes reset the inactivity
# clock is the open question this design works around: the job also re-enables
# the rotation outright, which does not depend on the answer.
permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record a heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ  keepalive" >> .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "Keepalive: $(date -u +%Y-%m-%d)"
          git push

      # The part that actually recovers the schedule. Re-enabling a workflow
      # that is already active is a no-op, so this is safe to run every time,
      # and it repairs the exact failure that took the daily down rather than
      # only trying to prevent it.
      - name: Re-enable the rotation if GitHub disabled it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "Daily Puzzle Rotation" --repo "$GITHUB_REPOSITORY" || true
          gh workflow list --repo "$GITHUB_REPOSITORY" --all
